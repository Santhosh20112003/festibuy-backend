spring.application.name=festibuy-backend
server.port=${SERVER_PORT:9090}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/festibuy_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:festibuy123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS Configuration (comma-separated origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://festibuy.saandy.in}

# Swagger / OpenAPI Documentation
springdoc.api-docs.enabled=${SWAGGER_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Per-IP Rate Limiting Configuration (Resilience4j)
rate-limit.read.limit=${RATE_LIMIT_READ_LIMIT:60}
rate-limit.read.period-seconds=${RATE_LIMIT_READ_PERIOD:60}
rate-limit.write.limit=${RATE_LIMIT_WRITE_LIMIT:15}
rate-limit.write.period-seconds=${RATE_LIMIT_WRITE_PERIOD:60}