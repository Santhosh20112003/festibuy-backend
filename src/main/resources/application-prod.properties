# ===================================================================
# FestiBuy Production Configuration Profile (`prod`)
# ===================================================================

# Hibernate & JPA Hardening
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# Swagger / OpenAPI Disabled by default in Production
springdoc.api-docs.enabled=${SWAGGER_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}

# Per-IP Rate Limiting Production Defaults
rate-limit.read.limit=${RATE_LIMIT_READ_LIMIT:60}
rate-limit.read.period-seconds=${RATE_LIMIT_READ_PERIOD:60}
rate-limit.write.limit=${RATE_LIMIT_WRITE_LIMIT:15}
rate-limit.write.period-seconds=${RATE_LIMIT_WRITE_PERIOD:60}

# Production Logging Levels
logging.level.root=INFO
logging.level.com.festibuy=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
