# ===================================================================
# FestiBuy Production Configuration Profile (`prod`)
# ===================================================================

# Hibernate & JPA Hardening
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# Swagger / OpenAPI Disabled by default in Production
springdoc.api-docs.enabled=${SWAGGER_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}

# Resilience4j Rate Limiter Production Defaults
resilience4j.ratelimiter.instances.shopApi.limit-for-period=${RATE_LIMIT_SHOP_API:60}
resilience4j.ratelimiter.instances.shopApi.limit-refresh-period=${RATE_LIMIT_SHOP_REFRESH:1m}
resilience4j.ratelimiter.instances.shopApi.timeout-duration=0ms

resilience4j.ratelimiter.instances.shopWriteApi.limit-for-period=${RATE_LIMIT_WRITE_API:15}
resilience4j.ratelimiter.instances.shopWriteApi.limit-refresh-period=${RATE_LIMIT_WRITE_REFRESH:1m}
resilience4j.ratelimiter.instances.shopWriteApi.timeout-duration=0ms

# Production Logging Levels
logging.level.root=INFO
logging.level.com.festibuy=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
